syntax = "proto3";
package rune.runerewards.v1;

import "gogoproto/gogo.proto";

option go_package = "github.com/hoodium-io/hoodium/x/runerewards/types";

// Tier is one step of the RUNE emission schedule. A tier is active while the
// current block height is in [start_height, end_height). end_height == 0 means
// the tier is open-ended (the final, effectively-infinite tier).
//
// Tier also carries the Proof of Network Activity (PoNA) rates for that tier.
// The reward actually paid for a block depends on how many transactions the
// block contains (see docs/technologies/pona.md):
//
//	tx_count >= tx_count_threshold  -> reward_per_block   (full)
//	0 < tx_count < tx_count_threshold -> low_activity_reward
//	tx_count == 0                   -> zero_activity_reward
//
// If tx_count_threshold is 0, PoNA is disabled for the tier and the full
// reward_per_block is always paid.
message Tier {
  // start_height is the first block height (inclusive) at which this tier applies.
  uint64 start_height = 1;
  // end_height is the first block height (exclusive) at which this tier stops
  // applying. Zero means open-ended.
  uint64 end_height = 2;
  // reward_per_block is the static reward emitted each block while this tier is
  // active and the block is "full" (tx_count >= tx_count_threshold), in arune
  // (1 RUNE = 10^18 arune).
  string reward_per_block = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"reward_per_block\""
  ];
  // tx_count_threshold is the minimum number of transactions a block must
  // contain for the full reward_per_block to be paid. Zero disables PoNA.
  uint64 tx_count_threshold = 4;
  // low_activity_reward is paid when 0 < tx_count < tx_count_threshold, in arune.
  string low_activity_reward = 5 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"low_activity_reward\""
  ];
  // zero_activity_reward is paid when tx_count == 0, in arune.
  string zero_activity_reward = 6 [
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (gogoproto.moretags) = "yaml:\"zero_activity_reward\""
  ];
}

// Params holds the runerewards module parameters.
message Params {
  // tiers is the ordered emission schedule (contiguous, non-overlapping,
  // starting at height 0, last tier open-ended). Each tier carries both the
  // full reward and its PoNA (activity-scaled) rates.
  repeated Tier tiers = 1 [(gogoproto.nullable) = false];
  // denom is the reward denomination (arune).
  string denom = 2;
}

// GenesisState is the runerewards module genesis state.
message GenesisState {
  // params are the module's initial parameters (includes the emission schedule).
  Params params = 1 [(gogoproto.nullable) = false];
}