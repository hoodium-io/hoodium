apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../common/monitoring
  - prometheus/configmap.yaml
  - ingress.yaml
  - balance-exporter/configmap.yaml

patches:
  - path: grafana/deployement-patch.yaml

configMapGenerator:
  - name: grafana-dashboards-rune
    files:
      - grafana/dashboards/rune-nodes-public.json
      - grafana/dashboards/rune-nodes-private.json
      - grafana/dashboards/rune-portal.json
      - grafana/dashboards/accounts.json

generatorOptions:
  disableNameSuffixHash: true
  annotations:
    note: generated

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/managed-by: kustomize
      app.kubernetes.io/part-of: production

namespace: monitoring
