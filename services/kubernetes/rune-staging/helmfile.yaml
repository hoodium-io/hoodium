helmDefaults:
  kubeContext: gke_rune-test-420708_us-central1_rune-staging-gke-cluster

repositories:
  - name: hoodium-io
    url: https://hoodium-io.github.io/validator-kit
  - name: blockscout
    url: https://blockscout.github.io/helm-charts

releases:
  - name: rune-node-0
    installed: true
    namespace: default
    chart: hoodium-io/runed
    version: 13.0.0
    labels:
      type: validator
    values:
      - ./values/rune-node-common.yaml
      - ./values/rune-node-0.yaml

  - name: rune-node-1
    installed: true
    namespace: default
    chart: hoodium-io/runed
    version: 13.0.0
    labels:
      type: validator
    values:
      - ./values/rune-node-common.yaml
      - ./values/rune-node-1.yaml

  - name: rune-node-2
    installed: true
    namespace: default
    chart: hoodium-io/runed
    version: 13.0.0
    labels:
      type: validator
    values:
      - ./values/rune-node-common.yaml
      - ./values/rune-node-2.yaml

  - name: rune-node-3
    installed: true
    namespace: default
    chart: hoodium-io/runed
    version: 13.0.0
    labels:
      type: validator
    values:
      - ./values/rune-node-common.yaml
      - ./values/rune-node-3.yaml

  - name: rune-node-4
    installed: true
    namespace: default
    chart: hoodium-io/runed
    version: 13.0.0
    labels:
      type: validator
    values:
      - ./values/rune-node-common.yaml
      - ./values/rune-node-4.yaml

  - name: postgresql
    installed: true
    namespace: default
    chart: oci://registry-1.docker.io/bitnamicharts/postgresql
    version: 15.2.10
    values:
      - ./values/postgresql.yaml

  - name: blockscout-stack
    installed: true
    namespace: default
    chart: blockscout/blockscout-stack
    version: 1.5.0
    values:
      - ./values/blockscout-stack.yaml
