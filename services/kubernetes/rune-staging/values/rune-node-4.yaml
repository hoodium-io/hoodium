  size: "100Gi"
  useDataSource:
    enabled: true
    apiGroup: ""
    kind: PersistentVolumeClaim
    name: "rune-node-data-rune-node-4-0"

service:
  public:
    loadBalancerIP: "34.70.22.86" # same as PUBLIC_IP

labels:
